name: 'GitHub Release'
description: >-
  Create (or update) a GitHub Release for a tag, with notes lifted from the
  repo's changelog. Uses only `gh` and `awk`, both present on GitHub-hosted
  runners — no third-party action, so no org allow-list entry is needed.
  Requires `contents: write` on the calling job.

inputs:
  tag:
    description: 'Tag to release. Defaults to the tag that triggered the workflow.'
    required: false
    default: ''
  changelog-file:
    description: 'Changelog to lift notes from. Empty, or a missing file, means auto-generated notes.'
    required: false
    default: 'CHANGES.md'
  footer:
    description: 'Optional markdown appended to the release notes.'
    required: false
    default: ''
  assets:
    description: 'Space-separated files to attach to the release.'
    required: false
    default: ''
  prerelease:
    description: "'auto' marks a prerelease when the tag has a suffix (8.1.0-rc.1); 'true'/'false' force it."
    required: false
    default: 'auto'
  draft:
    description: 'Create the release as a draft.'
    required: false
    default: 'false'

outputs:
  url:
    description: 'URL of the created or updated release.'
    value: ${{ steps.release.outputs.url }}

runs:
  using: composite
  steps:
    - id: release
      shell: bash
      env:
        IN_TAG: ${{ inputs.tag }}
        CHANGELOG: ${{ inputs.changelog-file }}
        FOOTER: ${{ inputs.footer }}
        ASSETS: ${{ inputs.assets }}
        PRERELEASE: ${{ inputs.prerelease }}
        DRAFT: ${{ inputs.draft }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        TAG="${IN_TAG:-${GITHUB_REF_NAME:-}}"
        if [ -z "$TAG" ]; then
          echo "::error::no tag to release — pass the 'tag' input or run this on a tag ref"
          exit 1
        fi
        if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
          echo "::error::tag '${TAG}' does not exist in this checkout (need fetch-depth: 0?)"
          exit 1
        fi

        # ---- release notes -------------------------------------------------
        NOTES_FILE="$(mktemp)"
        USE_GENERATED=1

        if [ -n "$CHANGELOG" ] && [ -f "$CHANGELOG" ]; then
          # Match a heading naming this version, then print until the NEXT
          # version heading. Handles the common shapes:
          #   [2026-05-07] Version 8.11.6      (twilio SDK changelogs)
          #   ## [8.11.6] - 2026-05-07         (keep-a-changelog)
          #   ## 8.11.6
          # The bare version (tag minus any leading v) is what we look for.
          VERSION="${TAG#v}"
          awk -v want="$VERSION" '
            function is_heading(line) {
              # A heading that names SOME version: "Version X", "## [X]", "## X".
              return (line ~ /^\[?[0-9]{4}-[0-9]{2}-[0-9]{2}\]?[[:space:]]*Version[[:space:]]+[0-9]/) ||
                     (line ~ /^#{1,3}[[:space:]]*\[?[0-9]+\.[0-9]+/)
            }
            function names_want(line) {
              # Same heading, but specifically our version, and not a longer
              # version that merely starts with it (8.11.6 must not match 8.11.60).
              return is_heading(line) && line ~ ("(^|[^0-9.])" want "([^0-9.]|$)")
            }
            !found && names_want($0) { found = 1; next }
            found && is_heading($0)  { exit }
            # Skip the setext underline that follows a heading, and leading blanks.
            found && $0 ~ /^[-=]+$/ && !body { next }
            found { if ($0 != "" || body) { print; body = 1 } }
          ' "$CHANGELOG" > "$NOTES_FILE"

          # Trim trailing blank lines.
          if [ -s "$NOTES_FILE" ]; then
            awk 'NF {p = NR} {l[NR] = $0} END {for (i = 1; i <= p; i++) print l[i]}' \
              "$NOTES_FILE" > "${NOTES_FILE}.trim" && mv "${NOTES_FILE}.trim" "$NOTES_FILE"
          fi

          if [ -s "$NOTES_FILE" ]; then
            USE_GENERATED=0
            echo "::notice::release notes taken from ${CHANGELOG} for version ${VERSION}"
          else
            echo "::warning::no ${CHANGELOG} section found for version ${VERSION}; falling back to auto-generated notes"
          fi
        fi

        if [ -n "$FOOTER" ]; then
          { echo; echo "$FOOTER"; } >> "$NOTES_FILE"
          USE_GENERATED=0
        fi

        # ---- flags ---------------------------------------------------------
        ARGS=()
        case "$PRERELEASE" in
          auto)  case "$TAG" in *-*) ARGS+=(--prerelease) ;; esac ;;
          true)  ARGS+=(--prerelease) ;;
          false) ;;
          *) echo "::error::prerelease must be 'auto', 'true', or 'false' (got '${PRERELEASE}')"; exit 1 ;;
        esac
        [ "$DRAFT" = "true" ] && ARGS+=(--draft)

        if [ "$USE_GENERATED" -eq 1 ]; then
          ARGS+=(--generate-notes)
        else
          ARGS+=(--notes-file "$NOTES_FILE")
        fi

        # ---- create, or update if it already exists ------------------------
        # Idempotent so a re-run after a partial failure doesn't dead-end.
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "::notice::release ${TAG} already exists — updating its notes"
          if [ "$USE_GENERATED" -eq 1 ]; then
            gh release edit "$TAG" --title "$TAG"
          else
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          fi
        else
          gh release create "$TAG" --title "$TAG" --verify-tag "${ARGS[@]}"
        fi

        # Attach assets separately: works for both the create and update path.
        if [ -n "$ASSETS" ]; then
          # shellcheck disable=SC2086
          gh release upload "$TAG" $ASSETS --clobber
        fi

        URL="$(gh release view "$TAG" --json url --jq .url)"
        echo "url=${URL}" >> "$GITHUB_OUTPUT"
        echo "::notice::released ${TAG} → ${URL}"
