name: "Artifactory OIDC login"
description: >-
  Exchange the GitHub Actions OIDC token for a short-lived Artifactory access
  token and point your package manager at the curated registry. For `npm` this
  writes ~/.npmrc; for `python` it exports UV_INDEX_URL / PIP_INDEX_URL; for
  `ruby` it configures Bundler to mirror rubygems.org through Artifactory; for
  `php` it writes Composer's GLOBAL config; for `dotnet` it registers an
  Artifactory NuGet source. No long-lived secrets. Requires `id-token: write`
  on the calling job.

inputs:
  ecosystem:
    description: "Package ecosystem to configure: 'npm' (writes ~/.npmrc), 'python' (exports UV_INDEX_URL / PIP_INDEX_URL), 'ruby' (configures Bundler mirror), 'php' (writes Composer global config), 'dotnet' (adds a NuGet source), or 'gradle' (writes ~/.gradle/artifactoryoidc.properties)."
    required: false
    default: "npm"
  artifactory-url:
    description: "Artifactory base URL. Defaults to the public pull-through cache; override for a different host."
    required: false
    default: "https://twilio.jfrog.io"
  registry-path:
    description: "Artifactory virtual repo path used for the registry + auth line. Defaults per ecosystem (virtual-npm-thirdparty / virtual-pypi-thirdparty / virtual-gems-thirdparty / virtual-php-thirdparty / virtual-nuget-thirdparty)."
    required: false
    default: ""
  provider-name:
    description: "JFrog OIDC provider name (must match the JFrog OIDC configuration)."
    required: false
    default: "github-actions"

runs:
  using: composite
  steps:
    - name: Exchange OIDC token for Artifactory token
      shell: bash
      env:
        ECOSYSTEM: ${{ inputs.ecosystem }}
        INPUT_URL: ${{ inputs.artifactory-url }}
        REGISTRY_PATH: ${{ inputs.registry-path }}
        PROVIDER_NAME: ${{ inputs.provider-name }}
      run: |
        ARTIFACTORY_URL="${INPUT_URL:-${ARTIFACTORY_URL:-}}"
        if [ -z "$ARTIFACTORY_URL" ]; then
          echo "::error::set the artifactory-url input or the ARTIFACTORY_URL env var (usually the vars.ARTIFACTORY_URL repo variable)"
          exit 1
        fi
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::no OIDC token available — the calling job needs 'permissions: id-token: write'"
          exit 1
        fi

        # Per-ecosystem default for the virtual repo path.
        if [ -z "$REGISTRY_PATH" ]; then
          case "$ECOSYSTEM" in
            npm)    REGISTRY_PATH='virtual-npm-thirdparty' ;;
            python) REGISTRY_PATH='virtual-pypi-thirdparty' ;;
            ruby)   REGISTRY_PATH='virtual-gems-thirdparty' ;;
            php)    REGISTRY_PATH='virtual-php-thirdparty' ;;
            dotnet) REGISTRY_PATH='virtual-nuget-thirdparty' ;;
            maven)   REGISTRY_PATH='virtual-maven-thirdparty' ;;
            gradle) ;;  # repos are defined in gradle-mirrors.init.gradle, not here
            *) echo "::error::unknown ecosystem '$ECOSYSTEM' (expected 'npm', 'python', 'ruby', 'php', 'maven', 'gradle', or 'dotnet')"; exit 1 ;;
          esac
        fi

        # 1. Request a GitHub JWT scoped to Artifactory as the audience.
        GITHUB_JWT=$(curl -sS \
          -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ARTIFACTORY_URL}" \
          | jq -r '.value')

        if [ -z "$GITHUB_JWT" ] || [ "$GITHUB_JWT" = "null" ]; then
          echo "::error::could not obtain a GitHub OIDC token from the Actions token service"
          exit 1
        fi
        # The JWT is itself a bearer credential — whoever holds it can exchange it
        # at Artifactory, or at any other relying party that trusts this repo,
        # until it expires. Mask it before anything downstream can echo it.
        echo "::add-mask::$GITHUB_JWT"

        PAYLOAD=$(echo "$GITHUB_JWT" | cut -d. -f2 | sed 's/-/+/g; s/_/\//g' | base64 -d 2>/dev/null || true)
        echo "::debug::OIDC claims: sub=$(echo "$PAYLOAD" | jq -r '.sub'), aud=$(echo "$PAYLOAD" | jq -r '.aud')"

        # 2. Exchange the GitHub JWT for an Artifactory access token.
        RESP=$(curl -sS "${ARTIFACTORY_URL}/access/api/v1/oidc/token" \
          -H 'Content-Type: application/json' \
          -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",
               \"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\",
               \"subject_token\":\"${GITHUB_JWT}\",
               \"provider_name\":\"${PROVIDER_NAME}\"}")
        ART_USERNAME=$(echo "$RESP" | jq -r '.username // empty')
        ART_TOKEN=$(echo "$RESP" | jq -r '.access_token // empty')

        if [ -z "$ART_TOKEN" ]; then
          echo "::error::OIDC token exchange failed. Raw response (token field redacted):"
          echo "$RESP" | jq 'if .access_token then .access_token="<redacted>" else . end' 2>/dev/null || echo "$RESP"
          exit 1
        fi
        echo "::add-mask::$ART_TOKEN"

        # 3. Point the package manager at the curated Artifactory registry.
        HOST=$(echo "${ARTIFACTORY_URL}" | sed -E 's#^https?://##')
        case "$ECOSYSTEM" in
          npm)
            # npm/yarn(classic)/pnpm read ~/.npmrc.
            # (yarn Berry reads .yarnrc.yml — set npmRegistryServer there instead.)
            REGISTRY="${ARTIFACTORY_URL}/artifactory/api/npm/${REGISTRY_PATH}/"
            {
              echo "registry=${REGISTRY}"
              echo "//${HOST}/artifactory/api/npm/${REGISTRY_PATH}/:_authToken=${ART_TOKEN}"
            } > ~/.npmrc
            echo "::notice::npm configured to use Artifactory registry (${REGISTRY})"
            ;;
          python)
            # JFrog access tokens authenticate as a Bearer token, NOT as basic auth
            # with username "token" (that returns 401). pip/uv index URLs use HTTP
            # basic auth, so present the token as the PASSWORD with an EMPTY username.
            INDEX_URL="https://:${ART_TOKEN}@${HOST}/artifactory/api/pypi/${REGISTRY_PATH}/simple/"
            echo "::add-mask::${INDEX_URL}"
            echo "UV_INDEX_URL=${INDEX_URL}" >> "$GITHUB_ENV"
            echo "PIP_INDEX_URL=${INDEX_URL}" >> "$GITHUB_ENV"
            echo "::notice::uv and pip configured to resolve through Artifactory (${REGISTRY_PATH})"
            ;;
          ruby)
            MIRROR_URL="https://${HOST}/artifactory/api/gems/${REGISTRY_PATH}/"
            echo "::add-mask::${ART_TOKEN}"
            echo "BUNDLE_MIRROR__HTTPS://RUBYGEMS__ORG/=${MIRROR_URL}" >> "$GITHUB_ENV"
            CRED_KEY=$(echo "$HOST" | sed 's/\./__/g; s/-/___/g' | tr '[:lower:]' '[:upper:]')
            ART_USER_ESCAPED=$(printf '%s' "$ART_USERNAME" | sed 's/\//%2F/g')
            echo "BUNDLE_${CRED_KEY}=${ART_USER_ESCAPED}:${ART_TOKEN}" >> "$GITHUB_ENV"
            echo "::notice::Bundler configured to mirror rubygems.org through Artifactory (${REGISTRY_PATH})"
            ;;
          php)
            if ! command -v composer >/dev/null 2>&1; then
              echo "::error::composer not found on PATH — run shivammathur/setup-php (or otherwise install Composer) BEFORE this action"
              exit 1
            fi

            # Write to Composer's GLOBAL config, never the repo's composer.json.
            # A committed `repositories` block would ship an internal Twilio
            # hostname to every consumer of a public package, and `composer-
            # lockfile-hygiene` fails the build if one is present.
            composer config --global \
              repositories.twilio-curated composer \
              "${ARTIFACTORY_URL}/artifactory/api/composer/${REGISTRY_PATH}"

            # Disable public Packagist so curation is FAIL-CLOSED. Composer
            # consults repositories in order and falls through on a miss, so
            # leaving packagist.org enabled means any package Artifactory REFUSES
            # (curation block, CVE, version-age cooldown) is silently fetched
            # from upstream instead — the control would fail open with no error.
            #
            # The key MUST be `packagist.org`. The legacy `repo.packagist` alias
            # creates a separate entry named "packagist" and leaves the real
            # default enabled.
            composer config --global repo.packagist.org false

            # JFrog access tokens authenticate as a BEARER token. Composer's
            # http-basic requires a username, and JFrog rejects the literal
            # "token" as one (401) — so use Composer's bearer auth instead.
            composer config --global --auth "bearer.${HOST}" "${ART_TOKEN}"

            echo "::notice::composer configured to resolve through Artifactory (${REGISTRY_PATH})"
            ;;
          dotnet)
            dotnet nuget add source "${ARTIFACTORY_URL}/artifactory/api/nuget/v3/${REGISTRY_PATH}/index.json" --name Artifactory --username "${ART_USERNAME}" --password "${ART_TOKEN}" --store-password-in-clear-text
            ;;
          maven)
            mkdir -p ~/.m2/
            # Pass vars explicitly into envsubst's environment so the child process can see them.
            ART_USERNAME="$ART_USERNAME" \
            ART_TOKEN="$ART_TOKEN" \
            ARTIFACTORY_URL="$ARTIFACTORY_URL" \
            REGISTRY_PATH="$REGISTRY_PATH" \
              envsubst < "$GITHUB_ACTION_PATH/maven-settings.xml.tmpl" > ~/.m2/settings.xml
            echo "::notice::Maven configured to use Artifactory registry (${REGISTRY_PATH})"
            ;;
          gradle)
            mkdir -p ~/.gradle/init.d/
            cp "$GITHUB_ACTION_PATH/gradle-mirrors.init.gradle" ~/.gradle/init.d/mirrors.init.gradle
            printf 'url=%s\nusername=%s\ntoken=%s\n' "$ARTIFACTORY_URL" "$ART_USERNAME" "$ART_TOKEN" > ~/.gradle/artifactoryoidc.properties
            echo "::notice::Gradle init file added to overwrite repositories on Gradle runs (${ARTIFACTORY_URL})"
            ;;
        esac
