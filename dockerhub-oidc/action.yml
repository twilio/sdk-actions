name: "Docker Hub OIDC login"
description: >-
  Exchange the GitHub Actions OIDC token for a short-lived Docker Hub access
  token and log in to Docker Hub. No long-lived secrets. Requires
  `id-token: write` on the calling job.

inputs:
  connection-id:
    description: "Docker Hub OIDC connection ID (UUID). Find this in your Docker Hub organization's OIDC settings."
    required: false
    default: "9d123e72-821d-4771-b43e-fb2a187b0197"
  organization:
    description: "Docker Hub organization to log in as."
    required: false
    default: "twilio"

runs:
  using: composite
  steps:
    - name: Exchange OIDC token for Docker Hub token
      id: docker_oidc
      uses: docker/oidc-action@b048fb089ace3e15a5fbdd784f4784d284ce5e8d # v1.1.0
      with:
        connection-id: ${{ inputs.connection-id }}

    - name: Docker Hub login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.organization }}
        password: ${{ steps.docker_oidc.outputs.token }}
